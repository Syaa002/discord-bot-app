<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Two Dashboard • Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="zt-horn-icon">🌸</div>
      <h1 class="login-title">ZERO TWO DASHBOARD</h1>
      <span class="zt-badge">CODE: 002 • FRANXX SYSTEM</span>

      <p style="color: var(--zt-text-muted); font-size: 14px; margin-bottom: 24px;">
        "Darling, buktikan identitasmu untuk mengakses kendali bot."
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="password">Password Akses Pemilik</label>
          <input type="password" id="password" class="form-input" placeholder="Masukkan password dashboard..." required autofocus>
        </div>

        <button type="submit" class="btn-zt-primary" id="btnSubmit">
          MASUK KE KOKPIT
        </button>
      </form>

      <div id="errorMsg" style="color: var(--zt-red-bright); font-size: 13px; font-weight: 700; margin-top: 16px; display: none;"></div>

      <p class="login-hint">
        🔒 Akses ini dilindungi secara privat khusus pemilik bot.
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      btnSubmit.innerText = 'MEMVERIFIKASI...';
      btnSubmit.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        const data = await res.json();

        if (data.success) {
          btnSubmit.innerText = 'SUKSES! MENGALIHKAN...';
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          errorMsg.innerText = data.message || 'Password salah!';
          errorMsg.style.display = 'block';
          btnSubmit.innerText = 'MASUK KE KOKPIT';
          btnSubmit.disabled = false;
        }
      } catch (err) {
        errorMsg.innerText = 'Gagal menghubungi server.';
        errorMsg.style.display = 'block';
        btnSubmit.innerText = 'MASUK KE KOKPIT';
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
